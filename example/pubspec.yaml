publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.0
  tickflow_chat:
    path: ../

flutter:
  uses-material-design: true
